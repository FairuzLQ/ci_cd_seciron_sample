name: SecIron Hardening

on:
  workflow_dispatch:
    inputs:
      apk_gdrive_link:
        description: 'Share link APK di GDrive (public)'
        required: true
        default: 'https://drive.google.com/file/d/1axmcOh-HT7oOy23086YOCDHDI8aY1FkI/view?usp=sharing'

jobs:
  harden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install gdown
        run: pip install gdown

      - name: Extract APK file ID
        id: ids
        run: |
          APK_LINK="${{ github.event.inputs.apk_gdrive_link }}"
          APK_ID=$(echo "$APK_LINK" | grep -oP '(?<=/d/)[^/]+')
          echo "apk_id=$APK_ID" >> $GITHUB_OUTPUT
          echo "APK ID: $APK_ID"

      - name: Download APK dari GDrive
        run: |
          mkdir -p input
          gdown "https://drive.google.com/uc?id=${{ steps.ids.outputs.apk_id }}" -O input/app.apk
          ls -lh input/

      - name: Download secapi.jar dari GDrive
        run: |
          mkdir -p tools
          gdown "https://drive.google.com/uc?id=${{ secrets.SECAPI_JAR_GDRIVE_ID }}" -O tools/secapi.jar

      - name: Create output directory
        run: mkdir -p hardened-output

      - name: Run SecIron Hardening
        run: |
          java -jar tools/secapi.jar \
            -i "https://id.portal.seciron.com" \
            -u "ci_cd_user" \
            --password "${{ secrets.IRONWALL_PASS }}" \
            -a "${{ secrets.IRONWALL_APIKEY }}" \
            -c "${{ secrets.IRONWALL_SECRET }}" \
            -f 0 \
            -t 981 \
            -p input/app.apk \
            -d hardened-output/ \
            --action ud \
            --ks "2017052453618319362" \
            --ms "1959821833008054273" \
            --lp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardened-apk
          path: hardened-output/
          retention-days: 7
