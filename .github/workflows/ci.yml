name: SecIron Hardening

on:
  workflow_dispatch:
    inputs:
      apk_gdrive_link:
        description: 'Share link APK di GDrive (public)'
        required: true
        default: 'https://drive.google.com/file/d/1V55oWc539n7QixpustbkD6sZJnmccp6U/view?usp=sharing'

jobs:
  harden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install gdown
        run: pip install gdown

      - name: Extract APK file ID
        id: ids
        run: |
          APK_LINK="${{ github.event.inputs.apk_gdrive_link }}"
          APK_ID=$(echo "$APK_LINK" | grep -oP '(?<=/d/)[^/]+')
          echo "apk_id=$APK_ID" >> $GITHUB_OUTPUT
          echo "APK ID: $APK_ID"

      - name: Download APK dari GDrive
        run: |
          mkdir -p input
          gdown "https://drive.google.com/uc?id=${{ steps.ids.outputs.apk_id }}" -O input/app.apk
          ls -lh input/

      - name: Download secapi.jar dari GDrive
        run: |
          mkdir -p tools
          gdown "https://drive.google.com/uc?id=${{ secrets.SECAPI_JAR_GDRIVE_ID }}" -O tools/secapi.jar

      - name: Create output directory
        run: mkdir -p hardened-output

      - name: Run SecIron Hardening
        run: |
          set -o pipefail
          java -jar tools/secapi.jar \
            -i "https://id.portal.seciron.com" \
            -u "ci_cd" \
            --password "${{ secrets.IRONWALL_PASS }}" \
            -a "${{ secrets.IRONWALL_APIKEY }}" \
            -c "${{ secrets.IRONWALL_SECRET }}" \
            -f 0 \
            -t 1543 \
            -p input/app.apk \
            -d hardened-output/ \
            --action ud \
            --ks "2114360404791525378" \
            --lp 2>&1 | tee hardening.log

          # secapi.jar exits 0 even when the server fails, so detect errors in the log
          if grep -qiE "Hardening failed|Status code:500|submit job failed|inject dex failed" hardening.log; then
            echo "::error::SecIron hardening failed on the server. Check the IronWall dashboard task log for details."
            exit 1
          fi

      - name: Verify hardened output
        run: |
          if [ -z "$(ls -A hardened-output/ 2>/dev/null)" ]; then
            echo "::error::hardened-output/ is empty, no hardened APK was produced."
            exit 1
          fi
          echo "Hardened output:"
          ls -lh hardened-output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardened-apk
          path: hardened-output/
          retention-days: 7
          if-no-files-found: error
